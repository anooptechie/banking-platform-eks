name: ci

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/ci.yaml"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/ci.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ECR_REPOSITORY: banking-platform

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.list.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: list
        run: |
          images=$( (ls app/services; echo frontend) | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "images=${images}" >> "$GITHUB_OUTPUT"
          echo "${images}"

  build:
    needs: discover
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC to AWS
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        image: ${{ fromJSON(needs.discover.outputs.images) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Work out build settings
        id: cfg
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          if [ "$IMAGE" = "frontend" ]; then
            echo "context=app/frontend" >> "$GITHUB_OUTPUT"
            echo "file=app/frontend/Dockerfile" >> "$GITHUB_OUTPUT"
            echo "build_args=" >> "$GITHUB_OUTPUT"
          else
            echo "context=app" >> "$GITHUB_OUTPUT"
            echo "file=app/build/service.Dockerfile" >> "$GITHUB_OUTPUT"
            echo "build_args=SERVICE=${IMAGE}" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ steps.cfg.outputs.context }}
          file: ${{ steps.cfg.outputs.file }}
          build-args: ${{ steps.cfg.outputs.build_args }}
          load: true
          push: false
          tags: local/${{ matrix.image }}:${{ steps.cfg.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Trivy report (HIGH and CRITICAL)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: local/${{ matrix.image }}:${{ steps.cfg.outputs.tag }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "0"

      - name: Trivy gate (CRITICAL fails the build)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: local/${{ matrix.image }}:${{ steps.cfg.outputs.tag }}
          severity: CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"

      - name: Configure AWS credentials
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Push to ECR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE: ${{ matrix.image }}
          TAG: ${{ steps.cfg.outputs.tag }}
        run: |
          REMOTE_TAG="${IMAGE}-${TAG}"
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" \
               --image-ids imageTag="$REMOTE_TAG" >/dev/null 2>&1; then
            echo "Tag ${REMOTE_TAG} already exists (immutable tags); skipping push."
            exit 0
          fi
          docker tag "local/${IMAGE}:${TAG}" "${REGISTRY}/${ECR_REPOSITORY}:${REMOTE_TAG}"
          docker push "${REGISTRY}/${ECR_REPOSITORY}:${REMOTE_TAG}"
