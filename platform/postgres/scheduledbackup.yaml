apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: banking-pg-every-6h
  namespace: banking
spec:
  schedule: "0 0 */6 * * *"      # six fields: second minute hour day month weekday
  immediate: true
  backupOwnerReference: self
  cluster:
    name: banking-pg
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
