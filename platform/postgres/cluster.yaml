apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: banking-pg
  namespace: banking
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:16
  storage:
    size: 10Gi
    storageClass: gp3
  postgresql:
    parameters:
      max_connections: "300"
  bootstrap:
    initdb:
      database: banking
      owner: banking
      secret:
        name: banking-db-credentials
  affinity:
    topologyKey: topology.kubernetes.io/zone
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits: { memory: 1Gi }
  serviceAccountTemplate:
    metadata:
      annotations:
        eks.amazonaws.com/role-arn: arn:aws:iam::766749599210:role/banking-platform-pg-backup
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: banking-pg-backups
