global:
  image:
    repository: "766749599210.dkr.ecr.us-east-1.amazonaws.com/banking-platform"
    tag: "ec0efab17482"          # git SHA (12 chars); CI bumps this
  secretName: banking-secrets   # holds POSTGRES_PASSWORD and JWT_SECRET (created outside Git)

# Non-secret environment shared by every backend service.
commonEnv:
  ENVIRONMENT: development
  POSTGRES_ENABLED: "true"
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_USER: banking
  POSTGRES_DB: banking
  REDIS_ENABLED: "true"
  REDIS_ADDR: redis:6379
  KAFKA_ENABLED: "true"
  KAFKA_BROKERS: kafka:9094
  OTEL_ENABLED: "false"
  JWT_ISSUER: banking-platform
  LOG_FORMAT: json

defaults:
  replicas: 1
  probes:
    liveness: /healthz
    readiness: /readyz
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits: { memory: 128Mi }
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile: { type: RuntimeDefault }
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities: { drop: [ALL] }

# One entry per workload. Per-service keys: grpc, env, tag, replicas, resources,
# probePath, commonEnv, podSecurityContext, securityContext.
services:
  # identity and customer
  auth-service: { grpc: true }
  authz-service: { grpc: true }
  customer-service: {}
  profile-service: {}
  kyc-service: {}
  document-service: { env: { S3_ENABLED: "false" } }
  # core banking
  ledger-service: { grpc: true }
  account-service: { grpc: true, env: { LEDGER_GRPC_ADDR: "ledger-service:9090" } }
  transaction-service: { env: { LEDGER_GRPC_ADDR: "ledger-service:9090" } }
  beneficiary-service: {}
  payment-service: { env: { LEDGER_GRPC_ADDR: "ledger-service:9090" } }
  wallet-service: {}
  # products
  loan-service: { env: { LEDGER_GRPC_ADDR: "ledger-service:9090" } }
  emi-service: {}
  fixed-deposit-service: {}
  recurring-deposit-service: {}
  card-service: {}
  investment-service: {}
  currency-exchange-service: {}
  # async, risk and insight
  audit-service: {}
  fraud-service: {}
  notification-service: {}
  statement-service: {}
  reports-service: {}
  analytics-service: {}
  search-service: {}
  email-service: {}
  sms-service: {}
  # ops
  support-service: {}
  admin-service: {}
  # edge
  api-gateway: { env: { CORS_ALLOWED_ORIGINS: "*" } }
  # SPA: nginx image, no backend env, runs with its own user model
  frontend:
    commonEnv: false
    probePath: /
    podSecurityContext: {}
    securityContext: {}
