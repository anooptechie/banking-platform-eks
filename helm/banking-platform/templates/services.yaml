{{- range $name, $svc := .Values.services }}
{{- $cfg := $svc | default dict }}
{{- $d := $.Values.defaults }}
{{- $psc := $d.podSecurityContext }}
{{- if hasKey $cfg "podSecurityContext" }}{{- $psc = $cfg.podSecurityContext }}{{- end }}
{{- $csc := $d.securityContext }}
{{- if hasKey $cfg "securityContext" }}{{- $csc = $cfg.securityContext }}{{- end }}
{{- $commonEnv := true }}
{{- if hasKey $cfg "commonEnv" }}{{- $commonEnv = $cfg.commonEnv }}{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/part-of: {{ $.Chart.Name }}
spec:
  replicas: {{ $cfg.replicas | default $d.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        app.kubernetes.io/part-of: {{ $.Chart.Name }}
      annotations:
        checksum/common-env: {{ toJson $.Values.commonEnv | sha256sum }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      enableServiceLinks: false
      {{- with $psc }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: "{{ $.Values.global.image.repository }}:{{ $name }}-{{ $cfg.tag | default $.Values.global.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            {{- if $cfg.grpc }}
            - name: grpc
              containerPort: 9090
            {{- end }}
          {{- if $commonEnv }}
          envFrom:
            - configMapRef:
                name: banking-common
          env:
            - name: SERVICE_NAME
              value: {{ $name | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.global.secretName }}
                  key: POSTGRES_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.global.secretName }}
                  key: JWT_SECRET
            {{- if $cfg.grpc }}
            - name: GRPC_ENABLED
              value: "true"
            {{- end }}
            {{- range $k, $v := $cfg.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: {{ $cfg.probePath | default $d.probes.readiness }}
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: {{ $cfg.probePath | default $d.probes.liveness }}
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml ($cfg.resources | default $d.resources) | nindent 12 }}
          {{- with $csc }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/part-of: {{ $.Chart.Name }}
spec:
  selector:
    app.kubernetes.io/name: {{ $name }}
  ports:
    - name: http
      port: 8080
      targetPort: http
    {{- if $cfg.grpc }}
    - name: grpc
      port: 9090
      targetPort: grpc
    {{- end }}
{{- end }}
